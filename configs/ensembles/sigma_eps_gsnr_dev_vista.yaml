# sigma_eps vs grism SNR -- Vista gh-dev statistics run (config Q).
# THE FIRST PLOT: sigma_eps at grism SNR {10, 20, 50}, broadband SNR fixed
# at 100, cosi drawn from the random-orientation population. 30 galaxies x
# 3 SNR values = 90 fits (~13% sigma_eps per point; CRN across the SNR axis
# sharpens the trend further). GPU packing: 8 workers/node.
run_name: sigma_eps_gsnr_dev_vista
version: 1
description: "sigma_eps vs emission-line SNR {30,50,100}, Vista gh-dev, config Q, 90 fits"
seed: 20260717
measurement: sigma_eps_vs_line_snr

bank:
  stratify:
    line_snr: {values: [30, 50, 100]}
  n_gal_per_bin: 30
  m_noise: 1
  draw:
    cosi: {dist: uniform, low: 0.1, high: 1.0}
    theta_int: {dist: uniform, low: 0.0, high: 3.141592653589793}
    vcirc: {dist: lognormal_tf, center_kms: 200.0, sigma_tf_dex: 0.08}
    z: {dist: uniform, low: 1.0, high: 1.9}
  fixed: {h_over_r: 0.1, x0: 0.0, y0: 0.0}

shear:
  scheme: fixed
  g1: 0.05
  g2: 0.05

ring:
  enabled: false

observed_config: canonical_Q
broadband_snr: 100

fit:
  sampler: numpyro
  n_warmup: 500
  n_samples: 1000
  n_chains: 4
  precondition: laplace
  target_accept: 0.8
  n_map_starts: 4
  pin_z_to_truth: true

dispatch:
  backend: slurm
  mode: dynamic
  workers_per_node: 8
  target_task_walltime_min: 90
  queue: gh-dev
  account: JPL-SPHEREx
  max_fit_walltime_min: 15

output:
  save_chains: all
  save_mocks: subset

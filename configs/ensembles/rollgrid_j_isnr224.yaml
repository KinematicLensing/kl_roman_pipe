# Roll-angle-forecast grid: one fiducial galaxy (Xu, Table I) on the forecast's
# flux x image-SNR x cos i grid through this pipeline, HLWAS rotac rolls and
# the Roman PSF, one broadband image (F158), matched-filter noise at the
# published depth. Fiducial: vcirc 251.5 km/s, turnover 0.05", broadband and
# Halpha half-light radii 0.3" (scale length 0.17875"), line width 0.175 nm
# rest (80 km/s), zero shear, theta_int pi/2, z 1.0 (assumed; the forecast
# does not state it), thickness h/R 0.1 (GalSim InclinedExponential default;
# the forecast model's value is unconfirmed). Line fluxes map to the per-pass
# label through the published-depth compactness of the galaxy at its cos i.
# Four noise realizations per cell. Image SNR for this spec: 223.607.
# Arm _j: the forecast's fit configuration. Eleven free parameters with the
# forecast's flat priors (sizes, fluxes, line width), |g| ~ N(0, 0.3), cos i
# U(0.001, 0.999), full-circle PA, Tully-Fisher lognormal 0.0749 dex on vcirc
# clipped at 3 sigma (the forecast places it on V2.2, a constant factor at
# this fixed turnover); centroids, systemic velocity, continuum and thickness
# fixed at truth. Sampler: no Laplace preconditioning (the flat turnover and
# line-width priors put the MAP on their lower edges, where the clipped Hessian
# gives a useless metric; the Z-score path with dense adaptation and 400 warmup
# draws samples cleanly; escalation is a Laplace-path feature and is off, so
# r-hat and ESS gates are read at analysis time). Grism geometry stays the HLWAS four-pass set
# 0/10/167/177 at per-pass depth (the forecast uses two exposures at 0/170
# carrying the same coadded depth); native 0.11" pixels. Prediction: posterior
# widths within 10% of the forecast's table at every grid point. The
# forecast's 1.5e-16 row (per-pass label 2-3 here) is left out: its widths
# are the flat prior box in both codes (sigma(v sin i) 140-160 km/s, g1 0.15),
# and on this sampler path that box-filling posterior is catastrophic (r-hat
# 39, 58% divergences on the first warm fit) at 20+ min per attempt.
run:
  name: rollgrid_j_isnr224
  version: 1
  description: forecast grid arm j, image SNR 223.607, 4 line fluxes x 5 cos i x 4 noise reps
  seed: 20261001
  measurement: sigma_eps_vs_line_snr
  noise_reps: 4
population:
  type: sampled
  stratify:
    line_flux_cgs:
      values:
      - 7.622e-16
      - 3.873e-15
      - 1.968e-14
      - 1.0e-13
  n_gal_per_bin: 5
  draw:
    cosi:
      dist: grid
      values:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 0.9
    theta_int:
      dist: grid
      values:
      - 1.5707963268
    vcirc:
      dist: lognormal_tf
      center_kms: 251.5
      sigma_tf_dex: 0.0749
      truth_sigma_tf_dex: 0.0
    z:
      dist: grid
      values:
      - 1.0
  fixed:
    h_over_r: 0.1
    x0: 0.0
    y0: 0.0
    vel.v0: 0.0
    vel.rscale: 0.05
    F158.rscale: 0.17875
    Halpha.rscale: 0.17875
    Halpha.dispersion: 80.0
    Halpha.cont.flux_per_nm: 0.0
  shear:
    scheme: fixed
    g1: 0.0
    g2: 0.0
  ring:
    enabled: false
model:
  render:
    oversample: 3
observation:
  config: hlwas_medium_roman_rotac_rolls_f158
  snr:
    broadband: 223.6068
fit:
  sampler: numpyro
  n_warmup: 400
  n_samples: 300
  n_chains: 4
  precondition: none
  adapt_mass: false
  target_accept: 0.9
  pin_z_to_truth: true
  shear_prior_sigma: 0.3
  cosi_prior_range:
  - 0.001
  - 0.999
  escalation:
    enabled: false
  pin_to_truth:
  - x0
  - y0
  - vel.v0
  - Halpha.cont.flux_per_nm
  prior_overrides:
    vel.vcirc:
      dist: lognormal
      median: 251.5
      sigma_dex: 0.0749
      clip_sigmas: 3.0
    vel.rscale:
      dist: uniform
      low: 0.001
      high: 1.0
    F158.rscale:
      dist: uniform
      low: 0.00596
      high: 0.5958
    Halpha.rscale:
      dist: uniform
      low: 0.00596
      high: 0.5958
    F158.flux:
      dist: uniform_relative
      low: 0.1
      high: 10.0
    Halpha.flux:
      dist: uniform_relative
      low: 0.1
      high: 10.0
    Halpha.dispersion:
      dist: uniform
      low: 19.6
      high: 200.0
dispatch:
  backend: local
  mode: dynamic
  claim_order: hard_first
  workers_per_node: 8
  target_task_walltime_min: 100
  queue: gb
  account: JPL-PUB
  max_fit_walltime_min: 90
output:
  save_chains: all
  save_mocks: subset

# sigma_eps vs cos i -- Vista gh-dev statistics run (config Q).
# 5 bins x 30 galaxies = 150 fits -> ~13% per-bin sigma_eps precision.
# GPU packing: 8 workers/node (measured GH200 optimum N~8-16, ~4x serial
# throughput); dispatch emits per-worker HBM slices automatically.
run:
  name: sigma_eps_cosi_dev_vista
  version: 1
  description: "sigma_eps vs cos i, Vista gh-dev, config Q, 150 fits"
  seed: 20260715
  measurement: sigma_eps_vs_cosi
  noise_reps: 1

population:
  type: sampled
  stratify:
    cosi: {n_bins: 5, range: [0.1, 0.9]}
  n_gal_per_bin: 30
  draw:
    theta_int: {dist: uniform, low: 0.0, high: 3.141592653589793}
    vcirc: {dist: lognormal_tf, center_kms: 200.0, sigma_tf_dex: 0.08}
    z: {dist: uniform, low: 1.0, high: 1.9}
  fixed: {h_over_r: 0.1, x0: 0.0, y0: 0.0}
  shear:
    scheme: fixed
    g1: 0.05
    g2: 0.05
  ring:
    enabled: false

model:
  render:
    oversample: 3

observation:
  config: canonical_Q
  snr:
    broadband: 100
    line: 100

fit:
  sampler: numpyro
  n_warmup: 500
  n_samples: 1000
  n_chains: 4
  precondition: laplace
  target_accept: 0.8
  n_map_starts: 4
  pin_z_to_truth: true

dispatch:
  backend: slurm
  mode: dynamic
  workers_per_node: 8
  target_task_walltime_min: 90
  queue: gh-dev
  account: JPL-SPHEREx
  max_fit_walltime_min: 15

output:
  save_chains: all
  save_mocks: subset

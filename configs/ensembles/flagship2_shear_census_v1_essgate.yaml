# ESS-gate sizing subset: paired rerun of 51 census galaxies (both ring
# members = 102 fits) at production sampling length (n_samples 1300, same
# w200-adapt baseline, escalation OFF so the ESS scaling is unconfounded).
# Selection from the 2026-07-24 census parquet: all 39 galaxies with a
# gate-failing fit (max_rhat > 1.05 OR min_ess < 50; 43 fits) + 12 clean
# galaxies stratified over worst-pair min-ESS sextiles (min and max per
# sextile). Same seed + galaxy_ids subset => identical population draws and
# noise seeds; pair to the census per (galaxy_id, ring_member). Purpose:
# (1) ESS scaling with chain length, especially the slow tail, (2) gate
# pass rates at production length -> ratify production ESS bar, (3) doubles
# as the escalation-tier rerun. Forecast ~9 node-hr (3x paired census
# walltimes at 8-way GH200 packing).
# Requires data/cosmohub/flagship2_v1 downloaded (login node, async Hive job).
run:
  name: flagship2_shear_census_v1_essgate
  version: 1
  description: "Census ESS-gate subset: 51 paired galaxies at production sampling length"
  seed: 20260724
  measurement: shear_bias
  noise_reps: 1

population:
  type: catalog
  catalog:
    download: flagship2_v1         # basename of data/cosmohub/<name>.yaml
    data_dir: data/cosmohub
  preprocess:
    flux_variant: model3_ext       # extincted model3 Halpha flux
    h: 0.67                        # Flagship cosmology; logM* = col - 2*log10(h)
  selection:
    z_range: [0.55, 1.9]
    # coadded 4-pass matched-filter line SNR. Was written as a
    # per-pass floor of 10, which selected this same coadded 20
    snr_line_total_min: 20.0
    # disk-dominated sample: ~70% of B/T <= 0.3 bulges are pseudobulges
    # (Mendez-Abreu+10); keeps 73% of dev-box disks (measured 2026-07-23)
    bulge_fraction_max: 0.3
    bulge_nsersic_range: null      # catalog-n cut removed (n is painted)
    # require the disk half-light radius to reach the diffraction PSF FWHM
    # at observed Halpha. A sub-PSF disk has no measurable velocity
    # gradient, and referencing the flux limit to the extended fiducial
    # rewards compact sources, so without this the selection reaches a
    # tenth of a pixel. At the median selected z the FWHM is 0.144" (1.3
    # pixels), so this floor puts ~2.6 pixels across the half-light
    # diameter and ~4.7 across the full disk: multiple resolution elements,
    # which is what a velocity field needs. A floor of 0.5 would leave
    # only one
    min_r50_over_psf_fwhm: 1.0
  sample:
    n_galaxies: 100                # full census bank (identical draws/seeds)
    replace: false
    # gate-failing + stratified-clean subset, provenance in header
    galaxy_ids: [0, 2, 4, 6, 9, 14, 18, 19, 20, 21, 22, 23, 24, 28, 29, 32, 35, 38, 41, 44, 45, 47, 48, 49, 50, 51, 53, 55, 59, 60, 62, 65, 72, 74, 75, 77, 78, 79, 81, 82, 83, 84, 85, 86, 88, 90, 92, 95, 96, 97, 99]
  paint:
    # Ubler+2017 Table 2 TFR, inverted to logv|logM form
    tfr: {logv0: 2.384, logm0: 10.50, slope: 3.60, scatter_dex: 0.061}
    # Ubler+2019 Table 3 sigma0(z) = intercept + slope*z
    sigma0: {intercept_kms: 21.1, slope_kms: 11.3, scatter_kms: 11.3, min_kms: 5.0}
  orientation:
    cosi_range: [0.05, 0.95]       # isotropic redraw; catalog inc kept for validation
    ring: {members: 2}             # theta and theta + pi/2 partner
  shear:
    sigma: 0.03                    # per-component iid Gaussian, shared within pair
    gmax: 0.1                      # redraw until |g| < gmax
  priors:
    logm_obs_scatter_dex: 0.25     # simulated photometric-mass error

model:
  render:
    oversample: 3

observation:
  config: canonical_P
  # line SNR is per-galaxy from the population table (matched-filter
  # snr_line_per_pass); a per-galaxy imaging depth anchor replacing this fixed
  # broadband SNR is a documented future step
  snr:
    broadband: 300

fit:
  sampler: numpyro
  # baseline config (2026-07-24): unconstrained coords + warmup adaptation
  # from the Laplace metric. Warmup 200 measured equal to 800 on the hardest
  # correct-MAP fit (div 1.7% vs 0.3%, rhat 1.02 vs 1.008, min ESS 110 vs
  # 123) at ~1/4 the warmup cost; frozen-metric constrained baseline was
  # div 50%, ESS 8. Escalation reruns (longer warmup/samples) key on
  # rhat/ESS, not divergence rate: frozen-metric catastrophes show div=0.
  n_warmup: 200
  n_samples: 1300
  n_chains: 2
  precondition: laplace
  unconstrained: true
  adapt_mass: true
  target_accept: 0.9
  pin_z_to_truth: true

dispatch:
  backend: slurm
  mode: dynamic
  # 8-way GPU packing: N=16 validated for single-disk config P; BulgeDisk
  # grids are larger, so start at 8 (drop to 4 on RESOURCE_EXHAUSTED)
  workers_per_node: 8
  target_task_walltime_min: 240
  queue: gh
  account: JPL-PUB        # TACC allocation (-A); used when dispatched via slurm
  max_fit_walltime_min: 150

output:
  save_chains: all
  save_mocks: all

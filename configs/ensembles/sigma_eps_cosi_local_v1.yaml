# sigma_eps vs cos i -- local overnight validation run (config Q).
# 5 bins x 4 galaxies = 20 fits at inspectable chain depth, with ALL chains,
# mock datavectors, and sampler outputs retained for per-fit inspection.
# Expected ~10-25 min/fit on an M3 (fresh XLA compile per galaxy) -> ~2-4 h
# wallclock with 2 workers.
run:
  name: sigma_eps_cosi_local_v1
  version: 1
  description: "sigma_eps vs cos i, local overnight validation, config Q, save-all"
  seed: 20260714
  measurement: sigma_eps_vs_cosi
  noise_reps: 1

population:
  type: sampled
  stratify:
    cosi: {n_bins: 5, range: [0.1, 0.9]}
  n_gal_per_bin: 4
  draw:
    theta_int: {dist: uniform, low: 0.0, high: 3.141592653589793}
    vcirc: {dist: lognormal_tf, center_kms: 200.0, sigma_tf_dex: 0.08}
    z: {dist: uniform, low: 1.0, high: 1.9}
  fixed: {h_over_r: 0.1, x0: 0.0, y0: 0.0}
  shear:
    scheme: fixed
    g1: 0.05
    g2: 0.05
  ring:
    enabled: false

model:
  render:
    oversample: 3

observation:
  config: canonical_Q
  snr:
    broadband: 100
    line: 100

fit:
  sampler: numpyro
  n_warmup: 300
  n_samples: 1000
  n_chains: 4
  precondition: laplace
  target_accept: 0.8
  pin_z_to_truth: true

dispatch:
  backend: local
  mode: dynamic
  workers_per_node: 2
  target_task_walltime_min: 240
  queue: gh-dev
  max_fit_walltime_min: 45

output:
  save_chains: all
  save_mocks: all

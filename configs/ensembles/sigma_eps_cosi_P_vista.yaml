# sigma_eps vs cos i -- Vista statistics run (gh queue) (config P).
# 5 bins x 30 galaxies = 150 fits -> ~13% per-bin sigma_eps precision.
# Config P (2 bands + 4 rolls): the Q shakedown run showed single-roll grism
# leaves vcirc prior-dominated and g2 degenerate with theta_int.
# GPU packing: 4 workers/node (first 8-worker P run OOMed: contexts +
# preallocation exhausted HBM; MPS + 0.75 headroom now emitted, 4 is safe).
run_name: sigma_eps_cosi_P_vista
version: 1
description: "sigma_eps vs cos i, Vista gh queue, config P, 150 fits"
seed: 20260715
measurement: sigma_eps_vs_cosi

bank:
  stratify:
    cosi: {n_bins: 5, range: [0.1, 0.9]}
  n_gal_per_bin: 30
  m_noise: 1
  draw:
    theta_int: {dist: uniform, low: 0.0, high: 3.141592653589793}
    vcirc: {dist: lognormal_tf, center_kms: 200.0, sigma_tf_dex: 0.08}
    z: {dist: uniform, low: 1.0, high: 1.9}
  fixed: {h_over_r: 0.1, x0: 0.0, y0: 0.0}

shear:
  scheme: fixed
  g1: 0.02
  g2: -0.01
  fit_prior_sigma: 0.2

ring:
  enabled: false

observed_config: canonical_P
broadband_snr: 100
line_snr: 100

fit:
  sampler: numpyro
  n_warmup: 500
  n_samples: 1000
  n_chains: 4
  precondition: laplace
  target_accept: 0.8
  n_map_starts: 4
  pin_z_to_truth: true

dispatch:
  backend: slurm
  mode: dynamic
  workers_per_node: 4
  target_task_walltime_min: 90
  # gh (production) not gh-dev: dev-queue QOS submit limits reject job
  # arrays while an idev session is running
  queue: gh
  account: JPL-SPHEREx
  # P fits pack at ~11 min latency (8 workers, GH200); 20 covers the tail
  max_fit_walltime_min: 20

output:
  save_chains: all
  save_mocks: subset

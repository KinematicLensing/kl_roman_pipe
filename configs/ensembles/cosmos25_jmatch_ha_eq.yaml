# Methodology-matching arm against cosmos25_census_v2_hfree_rolls (job 1034508):
# the same 50 galaxies (36 at cos i > 0.5, 14 edge-on spread in cos i), member-0
# fit only (no ring pair; per-fit posterior widths need none), same seed and
# noise streams, HLWAS 2-pair rolls, matched-filter noise (no shot noise),
# target_accept 0.9, sampled thickness. Common to every arm in the set: TF prior
# 0.049 dex with no photometric-mass term (width is not a driver at census
# depth). Deltas are read fit by fit against hfree_rolls member 0.
# J0 plus the line-size paint median moved to 1.0 (line traces the stellar
# disk, our 0.2 dex scatter): does knowing the line follows the continuum matter.
run:
  name: cosmos25_jmatch_ha_eq
  version: 1
  description: J0 with line size = disk size paint
  seed: 20260728
  measurement: shear_bias
  noise_reps: 1
population:
  type: catalog
  catalog:
    kind: cosmos25
    download: cosmos25_v1
    data_dir: data/cosmos2025/private
  preprocess:
    flux_variant: as_delivered
    h: 0.7
  selection:
    z_range:
    - 0.55
    - 1.9
    snr_line_total_min: 20.0
    bulge_fraction_max: null
    bulge_nsersic_range: null
    min_r50_over_psf_fwhm: 1.0
  sample:
    n_galaxies: 200
    replace: false
    galaxy_ids:
    - 12
    - 15
    - 16
    - 17
    - 19
    - 21
    - 25
    - 29
    - 31
    - 42
    - 43
    - 46
    - 55
    - 65
    - 74
    - 76
    - 84
    - 92
    - 93
    - 96
    - 97
    - 104
    - 113
    - 115
    - 119
    - 121
    - 126
    - 127
    - 134
    - 138
    - 140
    - 143
    - 148
    - 151
    - 152
    - 160
    - 163
    - 167
    - 172
    - 173
    - 175
    - 177
    - 182
    - 184
    - 186
    - 191
    - 194
    - 195
    - 196
    - 199
  paint:
    bulge: false
    h_over_r:
      median: 0.25
      scatter_dex: 0.14
    tfr:
      logv0: 2.384
      logm0: 10.5
      slope: 3.6
      scatter_dex: 0.049
    sigma0:
      intercept_kms: 21.1
      slope_kms: 11.3
      scatter_kms: 11.3
      min_kms: 5.0
    halpha_rscale_ratio:
      median: 1.0
      scatter_dex: 0.2
  orientation:
    cosi_range:
    - 0.05
    - 0.95
    ring:
      members: 1
  shear:
    sigma: 0.03
    gmax: 0.1
  priors:
    logm_obs_scatter_dex: 0.0
model:
  render:
    oversample: 3
observation:
  config: hlwas_medium_roman_rotac_rolls
fit:
  sampler: numpyro
  n_warmup: 200
  n_samples: 300
  n_chains: 4
  precondition: laplace
  unconstrained: true
  adapt_mass: true
  map_bounded: true
  map_polish_steps: 8
  map_polish_basins: 3
  eig_floor_mode: prior
  eig_floor: 0.5
  target_accept: 0.9
  pin_z_to_truth: true
  sample_h_over_r: true
  record_warmup: true
  escalation:
    enabled: true
    rhat_max: 1.05
    ess_min: 50
    n_warmup: 800
    n_samples: 1000
    mode: auto
  pin_to_truth:
  - x0
  - y0
  - vel.v0
  - Halpha.cont.flux_per_nm
  - Halpha.cont.rscale
dispatch:
  backend: local
  mode: dynamic
  claim_order: hard_first
  workers_per_node: 8
  target_task_walltime_min: 100
  queue: gb
  account: JPL-PUB
  max_fit_walltime_min: 90
output:
  save_chains: all
  save_mocks: all

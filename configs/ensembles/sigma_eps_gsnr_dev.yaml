# sigma_eps vs grism SNR -- local/idev micro-shakedown (config Q).
# 2 galaxies x 3 SNR values = 6 fits with tiny chains. Common random
# numbers: the SAME galaxies and noise pattern appear at every SNR step,
# so the SNR trend is a clean contrast.
run:
  name: sigma_eps_gsnr_dev
  version: 1
  description: "sigma_eps vs emission-line SNR {30,50,100}, micro-shakedown, config Q"
  seed: 20260716
  measurement: sigma_eps_vs_line_snr
  noise_reps: 1

population:
  type: sampled
  stratify:
    line_snr: {values: [30, 50, 100]}
  n_gal_per_bin: 2
  draw:
    cosi: {dist: uniform, low: 0.1, high: 1.0}
    theta_int: {dist: uniform, low: 0.0, high: 3.141592653589793}
    vcirc: {dist: lognormal_tf, center_kms: 200.0, sigma_tf_dex: 0.08}
    z: {dist: uniform, low: 1.0, high: 1.9}
  fixed: {h_over_r: 0.1, x0: 0.0, y0: 0.0}
  shear:
    scheme: fixed
    g1: 0.05
    g2: 0.05
  ring:
    enabled: false

model:
  render:
    oversample: 3

observation:
  config: canonical_Q
  snr:
    broadband: 100

fit:
  sampler: numpyro
  n_warmup: 100
  n_samples: 200
  n_chains: 2
  precondition: laplace
  target_accept: 0.8
  n_map_starts: 4
  pin_z_to_truth: true

dispatch:
  backend: local
  mode: dynamic
  workers_per_node: 2
  target_task_walltime_min: 60
  queue: gh-dev
  max_fit_walltime_min: 30

output:
  save_chains: all
  save_mocks: all

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kl_pipe"
version = "0.1.0"
description = "Test repo for a roman KL pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Spencer Everett", email = "severett@caltech.edu" }
]
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "pandas",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/KinematicLensing/kl_roman_pipe/"
Repository = "https://github.com/KinematicLensing/kl_roman_pipe/"

[tool.setuptools]
packages = ["kl_pipe"]

[tool.pytest.ini_options]
markers = [
    "tng50: tests that require TNG50 mock data from CyVerse",
    "tng_diagnostics: TNG diagnostic plotting tests (slow, large output files)",
    "slow: tests that take significant time to run",
    "diagnostic_plots: slow tests whose purpose is producing diagnostic figures (also marked slow; select with -m diagnostic_plots)",
    "grism_validation: cross-code grism validation against geko (requires reference data)",
    "galsim_reference: cross-check against the independent GalSim-chromatic reference render (self-contained, no external data/env)",
]
filterwarnings = [
    # Ignore ArviZ FutureWarning about upcoming refactor
    "ignore:.*ArviZ is undergoing a major refactor.*:FutureWarning",
    # Tests often create tasks without PSF intentionally
    "ignore::kl_pipe.sampling.task.NoPSFWarning",
]

# Flagship2 full-footprint row bank: the entire mock footprint above the
# superset cut, downloaded once. Motivation: the fully-filled 100 deg^2 v1
# region yields only ~657 galaxies through the science selection
# (2-component disk + B/T <= 0.3 + line SNR >= 10), which is too few for a
# shear-calibration campaign. Removing the RA/Dec box returns every galaxy
# the catalog holds so the usable pool is maximised in a single download.
#
# No RA/Dec cut: CosmoHub scans the whole table. Expect a large async job
# (tens of GB parquet, ~10^8 rows above the superset cut) -- run it detached
# (tmux) and resume with --query-id if the poller drops. The z + flux cuts
# are the same deliberate SUPERSET of the pipeline selection as v1/dev, so
# tightening a pipeline cut never requires a re-download.
#
# Same columns as flagship2_v1. Footprint is NOT uniform (edge regions are
# partially filled) -- fine for building a galaxy bank (per-galaxy properties
# are valid regardless of contiguous-area coverage); do NOT use this file for
# area-based number-density statistics without masking to filled regions.
name: flagship2_full
catalog_id: 353
table: cosmohub.euclid_fs2_mock_dr_v1_1_phz
format: parquet
columns:
  - galaxy_id
  - halo_id
  - ra_gal
  - dec_gal
  - true_redshift_gal
  - observed_redshift_gal
  - logf_halpha_model3
  - logf_halpha_model3_ext
  - logf_halpha_model1
  - logf_halpha_model1_ext
  - halpha_scatter
  - logf_n2_model3_ext
  - logf_o3_model3_ext
  - log_stellar_mass
  - log_sfr
  - disk_r50
  - disk_scalelength
  - disk_axis_ratio
  - disk_angle
  - disk_ellipticity
  - inclination_angle
  - bulge_fraction
  - bulge_r50
  - bulge_nsersic
  - bulge_axis_ratio
  - euclid_nisp_y
  - euclid_nisp_j
  - euclid_nisp_h
  - euclid_nisp_y_el_model3_ext
  - euclid_nisp_j_el_model3_ext
  - euclid_nisp_h_el_model3_ext
  - euclid_vis
  - euclid_vis_el_model3_ext
  - kappa
  - gamma1
  - gamma2
cuts:
  - true_redshift_gal BETWEEN 0.55 AND 1.9
  - logf_halpha_model3_ext > -16.5
